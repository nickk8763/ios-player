name: Build debug APK

# Runs on a push to ANY branch (the default branch may be `main` or `master`) and on demand
# (Actions tab -> "Build debug APK" -> Run workflow).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests + debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IosGlassPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # When something fails, the full log + test reports are downloadable from the run page,
      # so the error can be pasted/sent without scrolling through the web console.
      - name: Upload build log and reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-reports
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
